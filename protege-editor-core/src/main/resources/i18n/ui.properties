i18n.owl.refactor.amalgamateSubclassAxioms=Amalgamate subclass axioms
i18n.owl.refactor.amalgamateSubclassAxioms.tooltip=Merges subclass axioms that have a common left hand side. For example, A subClassOf B, A subClassOf C would be merged into a single subclass axiom, A subClassOf (B and C).

i18n.owl.refactor.splitDisjointClassesIntoPairwiseDisjoints=Split disjoint classes into pairwise disjoints
i18n.owl.refactor.splitDisjointClassesIntoPairwiseDisjoints.tooltip=Splits disjoint classes axioms in the active ontologies into pairwise disjoints to aid backwards compatibility. For example, disjointClasses(A, B, C) would be split into A disjointWith B, A disjointWith C, B disjointWith C

i18n.owl.refactor.amalgamateDisjointClassesIntoLargerDisjointSets=Amalgamate disjoint classes into larger disjoint sets
i18n.owl.refactor.amalgamateDisjointClassesIntoLargerDisjointSets.tooltip=Merges disjoint classes axioms in the active ontologies into more efficient sets. For example, A disjointWith B, A disjointWith C, B disjointWith C would be merged into disjointClasses(A, B, C)

